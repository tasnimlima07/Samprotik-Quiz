let timerInterval;
let timeLeft = 30 * 60; // 30 minutes in seconds

function startTimer() {
    timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("সময় শেষ! আপনার কুইজটি স্বয়ংক্রিয়ভাবে জমা হয়ে গেছে।");
            submitQuiz();
            return;
        }
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById("timer").innerText = 
            `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }, 1000);
}

function loadQuestions() {
    const container = document.getElementById("questions-container");
    let html = "";
    quizData.forEach((item, index) => {
        html += `<div class="question-block">
            <div class="question">${item.q}</div>
            <div class="options">`;
        item.options.forEach((opt, optIndex) => {
            html += `<label>
                <input type="radio" name="q${index}" value="${optIndex}"> ${opt}
            </label>`;
        });
        html += `</div></div>`;
    });
    container.innerHTML = html;
    startTimer();
}

function submitQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    let reviewHtml = "<h3>উত্তরপত্র ও মূল্যায়ন:</h3>";

    quizData.forEach((item, index) => {
        const radios = document.getElementsByName(`q${index}`);
        let selectedIndex = -1;
        for (let i = 0; i < radios.length; i++) {
            if (radios[i].checked) {
                selectedIndex = parseInt(radios[i].value);
                break;
            }
        }

        const isCorrect = selectedIndex === item.ans;
        if (isCorrect) score++;

        const userAnsText = selectedIndex !== -1 ? item.options[selectedIndex] : "উত্তর দেননি";
        const correctAnsText = item.options[item.ans];

        reviewHtml += `<div class="review-item ${isCorrect ? 'correct-ans' : 'wrong-ans'}">
            <strong>${item.q}</strong><br>
            আপনার উত্তর: ${userAnsText} <br>
            সঠিক উত্তর: <strong>${correctAnsText}</strong>
        </div>`;
    });

    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = `আপনার মোট স্কোর: ${score} / ${quizData.length}`;
    document.getElementById("review-container").innerHTML = reviewHtml;
    window.scrollTo(0, 0);
}

loadQuestions();
</script>
